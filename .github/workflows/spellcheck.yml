name: Spellcheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: just
      - name: Install spellcheck dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyspelling markdown
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en
      - name: Spellcheck
        run: just spellcheck

  # Spellcheck the pull-request title with the same wordlist/dictionary. The title becomes
  # the squashed-merge commit subject (git history) and its Conventional-Commit prefix drives
  # the release, so catch unknown words here at the source.
  pr-title:
    name: PR title spelling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: just
      - name: Install spellcheck dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyspelling markdown
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en
      - name: Spellcheck PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: just spellcheck-pr-title
